<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahlok Eco Products LLP — Paper Foodware, Mirzapur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  :root {
    --paper: #F4EFE6;
    --ink: #2B2521;
    --ink-soft: #6B5D52;
    --brick: #B24A2E;
    --brass: #A87C3F;
    --oxblood: #4A1F1C;
    --stone: #C9C0B4;
    --card: #FFFFFF;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', 'IBM Plex Sans Devanagari', system-ui, sans-serif;
    --font-body-hi: 'IBM Plex Sans Devanagari', 'IBM Plex Sans', system-ui, sans-serif;
    --section-pad: clamp(64px, 8vw, 140px);
    --max-width: 1200px;
    --radius: 4px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
  }
  h1, h2, h3, .brand-name { font-family: var(--font-display); color: var(--ink); margin: 0 0 0.5em; font-weight: 600; }
  .display { font-size: clamp(2.5rem, 6vw, 5.5rem); line-height: 1.05; }
  .heading { font-size: clamp(1.75rem, 3.5vw, 2.75rem); line-height: 1.1; }
  p { margin: 0 0 1em; color: var(--ink-soft); }
  a { color: inherit; }
  .container { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
  .section { padding: var(--section-pad) 0; position: relative; }
  .section__eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.78rem;
    color: var(--brass);
    font-weight: 600;
    margin-bottom: 12px;
  }

  /* Hindi typography: Fraunces has no Devanagari glyphs, so headings fall
     back to the body face at a reduced size when lang=hi. */
  html[lang="hi"] .display { font-family: var(--font-body-hi); font-size: clamp(2rem, 4.5vw, 4rem); }
  html[lang="hi"] .heading { font-family: var(--font-body-hi); font-size: clamp(1.5rem, 3vw, 2.2rem); }
  html[lang="hi"] .brand-name { font-family: var(--font-body-hi); }
  html[lang="hi"] .product-card__name { font-family: var(--font-body-hi); }

  .grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
  .span-7 { grid-column: span 7; }
  .span-5 { grid-column: span 5; }
  @media (max-width: 860px) {
    .grid-12 { grid-template-columns: 1fr; }
    .span-7, .span-5 { grid-column: 1; }
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 24px;
    border-radius: var(--radius);
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--ink);
    transition: background-color 0.2s ease, color 0.2s ease;
    cursor: pointer;
    font-size: 1rem;
    font-family: var(--font-body);
  }
  .btn--primary { background: var(--brick); color: var(--paper); border-color: var(--brick); }
  .btn--primary:hover { background: var(--oxblood); border-color: var(--oxblood); }
  .btn--ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn--ghost:hover { background: var(--ink); color: var(--paper); }

  /* Header */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(244, 239, 230, 0.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--stone);
  }
  .site-header__inner {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand-name { font-size: 1.4rem; margin: 0; }
  .brand-name span { color: var(--brick); }
  .nav-links { display: flex; gap: 22px; align-items: center; }
  .nav-links a { text-decoration: none; font-weight: 500; color: var(--ink); font-size: 0.92rem; }
  .nav-links a:hover { color: var(--brick); }
  .lang-toggle {
    border: 1px solid var(--brass);
    background: transparent;
    color: var(--ink);
    border-radius: var(--radius);
    padding: 6px 12px;
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .header-cta { display: none; }
  @media (min-width: 720px) { .header-cta { display: inline-flex; } }
  .nav-toggle { display: none; background: none; border: none; font-size: 1.5rem; color: var(--ink); cursor: pointer; }
  @media (max-width: 720px) {
    .nav-links {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--paper);
      flex-direction: column;
      align-items: flex-start;
      padding: 16px 24px 24px;
      border-bottom: 1px solid var(--stone);
      gap: 14px;
    }
    .nav-links.is-open { display: flex; }
    .nav-toggle { display: inline-flex; }
  }

  /* Hero */
  .hero { padding-top: 48px; }
  .hero__content {
    background: rgba(244, 239, 230, 0.92);
    padding: clamp(24px, 4vw, 48px);
    z-index: 2;
    margin-right: -60px;
  }
  @media (max-width: 860px) {
    .hero__content { margin-right: 0; padding: 24px; }
  }
  .hero__headline { display: flex; flex-direction: column; gap: 0.1em; }
  .hero__line { display: block; overflow: hidden; }
  .hero__line .char { display: inline-block; transform: translateY(100%); }
  .hero__sub { font-size: 1.1rem; max-width: 46ch; }
  .hero__actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; }
  .hero__photo-wrap { position: relative; z-index: 1; }
  .hero__meta {
    position: absolute;
    top: 16px;
    left: 16px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.7rem;
    color: var(--brass);
    font-weight: 600;
    font-family: var(--font-body);
  }
  html[lang="hi"] .hero__meta { font-family: var(--font-body-hi); font-size: 0.65rem; }
  .hero__photo {
    width: 100%;
    height: clamp(320px, 40vw, 520px);
    object-fit: cover;
    border: 1px solid var(--stone);
    display: block;
    clip-path: inset(0 0 0 0);
  }

  /* Product range */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
    margin-top: 40px;
  }
  @media (max-width: 640px) {
    .product-grid {
      grid-auto-flow: column;
      grid-auto-columns: 85%;
      grid-template-columns: none;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 16px;
      gap: 16px;
      margin-top: 32px;
      padding-left: 24px;
      padding-right: 24px;
    }
    .product-card {
      scroll-snap-align: start;
      flex: 0 0 auto;
      width: 280px;
    }
    .product-card__number { display: none; }
  }
  .product-grid::-webkit-scrollbar { height: 6px; }
  .product-grid::-webkit-scrollbar-track { background: transparent; }
  .product-grid::-webkit-scrollbar-thumb { background: var(--stone); border-radius: 3px; }
  .product-card { border: 1px solid var(--stone); display: flex; flex-direction: column; background: var(--card); position: relative; overflow: hidden; }
  .product-card__number {
    position: absolute;
    top: 16px;
    left: 16px;
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--ink);
    opacity: 0.15;
    line-height: 1;
    z-index: 1;
    pointer-events: none;
  }
  html[lang="hi"] .product-card__number { font-family: var(--font-body-hi); }
  .product-card__photo {
    width: 100%;
    height: 170px;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease-out;
  }
  .product-card:hover .product-card__photo { transform: scale(1.06); }
  .product-card__body { padding: 20px; display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 2; }
  .product-card__name { font-size: 1.15rem; margin: 0; }
  .product-card__use { font-size: 0.9rem; margin: 0; }
  .product-card__spec { font-size: 0.85rem; color: var(--brick); font-weight: 600; margin: 0 0 8px; }
  .product-card__link {
    margin-top: auto;
    text-decoration: none;
    font-weight: 600;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-top: 1px solid var(--stone);
    padding-top: 10px;
  }
  .product-card__link:hover { color: var(--brick); }

  /* Who we supply / mirzapur (placeholder shells this phase) */
  .who-we-supply, .mirzapur { background: rgba(168,124,63,0.08); }

  /* Why choose us */
  .why-us-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 40px;
  }
  .why-us-card {
    border: 1px solid var(--stone);
    border-radius: var(--radius);
    padding: 28px 24px;
    background: var(--card);
    position: relative;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .why-us-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(107,30,35,0.12);
    border-color: var(--brass);
  }
  .why-us-card__icon {
    width: 56px;
    height: 56px;
    margin-bottom: 16px;
    color: var(--brick);
  }
  .why-us-card__name {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  .why-us-card__desc {
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin: 0;
    line-height: 1.55;
  }

  /* Who we supply - card grid */
  .supply-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-top: 40px;
  }
  .supply-card {
    border: 1px solid var(--stone);
    border-radius: var(--radius);
    padding: 24px 20px;
    background: var(--card);
    text-align: center;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .supply-card:hover {
    transform: translateY(-3px);
    border-color: var(--brass);
    box-shadow: 0 8px 20px rgba(107,30,35,0.1);
  }
  .supply-card__icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 12px;
    color: var(--brick);
  }
  .supply-card__name {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0;
    line-height: 1.3;
  }

  /* Mirzapur split */
  .mirzapur-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: center;
    margin-top: 40px;
  }
  @media (max-width: 860px) { .mirzapur-split { grid-template-columns: 1fr; gap: 32px; } }
  .mirzapur__photo-wrap { position: relative; }
  .mirzapur__photo {
    width: 100%;
    height: clamp(280px, 35vw, 420px);
    object-fit: cover;
    border: 1px solid var(--stone);
    border-radius: var(--radius);
    clip-path: polygon(0% 0%, 100% 0%, 100% 92%, 95% 96%, 90% 91%, 85% 97%, 80% 92%, 75% 98%, 70% 93%, 65% 97%, 60% 91%, 55% 96%, 50% 92%, 45% 97%, 40% 93%, 35% 98%, 30% 92%, 25% 96%, 20% 91%, 15% 97%, 10% 93%, 5% 98%, 0% 92%);
    box-shadow: 0 20px 40px rgba(58,35,24,0.2);
  }

  /* Wholesale cards */
  .wholesale-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
    margin-top: 40px;
  }
  .wholesale-card {
    border: 1px solid var(--stone);
    border-radius: var(--radius);
    padding: 32px 28px;
    background: var(--card);
    position: relative;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .wholesale-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(107,30,35,0.12);
    border-color: var(--brick);
  }
  .wholesale-card--featured {
    border-color: var(--brick);
    background: linear-gradient(180deg, rgba(178,74,46,0.04) 0%, var(--card) 60%);
  }
  .wholesale-card__badge {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--brick);
    color: var(--paper);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .wholesale-card__title {
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  .wholesale-card__price {
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--brick);
    margin: 0 0 4px;
    line-height: 1;
  }
  .wholesale-card__unit { font-size: 1rem; font-weight: 500; color: var(--ink-soft); }
  .wholesale-card__desc { font-size: 0.9rem; color: var(--ink-soft); margin: 0 0 20px; line-height: 1.55; }
  .wholesale-card__features { list-style: none; padding: 0; margin: 0 0 24px; display: flex; flex-direction: column; gap: 8px; }
  .wholesale-card__features li { font-size: 0.9rem; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
  .wholesale-card__features li::before { content: ''; width: 6px; height: 6px; background: var(--brass); border-radius: 50%; flex-shrink: 0; }
  .wholesale-card__cta { width: 100%; }

  /* Torn photo effect (from v2) */
  .torn-photo {
    clip-path: polygon(0% 0%, 100% 0%, 100% 92%, 95% 96%, 90% 91%, 85% 97%, 80% 92%, 75% 98%, 70% 93%, 65% 97%, 60% 91%, 55% 96%, 50% 92%, 45% 97%, 40% 93%, 35% 98%, 30% 92%, 25% 96%, 20% 91%, 15% 97%, 10% 93%, 5% 98%, 0% 92%);
    box-shadow: 0 20px 40px rgba(58,35,24,0.25);
  }
  .tilt-left { transform: rotate(-2deg); }
  .tilt-right { transform: rotate(2deg); }

  /* Contact */
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 32px; }
  @media (max-width: 720px) { .contact-grid { grid-template-columns: 1fr; } }
  .contact-card, .contact-form-placeholder { border: 1px solid var(--stone); padding: 28px; background: var(--card); }
  .contact-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-weight: 600; margin-bottom: 14px; }
  .contact-row span:first-child { color: var(--ink-soft); font-weight: 500; }
  .contact-card .btn { margin-right: 10px; margin-bottom: 10px; }

  /* Footer */
  .site-footer { background: var(--oxblood); color: rgba(244,239,230,0.8); padding: 40px 0; font-size: 0.9rem; border-top: 1px solid var(--stone); }
  .site-footer__inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }

  /* Process */
  .process-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    margin-top: 40px;
  }
  @media (max-width: 1024px) { .process-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .process-grid { grid-template-columns: 1fr; } }

  .process-step {
    text-align: center;
    padding: 24px 16px;
  }
  .process-step__icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
  }
  .process-step__number {
    font-family: var(--font-display);
    font-size: 3rem;
    font-weight: 700;
    color: var(--brick);
    opacity: 0.15;
    line-height: 1;
    margin-bottom: 8px;
  }
  html[lang="hi"] .process-step__number { font-family: var(--font-body-hi); }
  .process-step__name {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 6px;
  }
  .process-step__desc {
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin: 0;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <p class="brand-name">Sahlok <span>Eco</span> Products</p>
    <nav class="nav-links">
      <a href="#product-range" data-en="Products" data-hi="उत्पाद">Products</a>
      <a href="#who-we-supply" data-en="Who We Supply" data-hi="हम किसे आपूर्ति करते हैं">Who We Supply</a>
      <a href="#process" data-en="How It's Made" data-hi="यह कैसे बनता है">How It's Made</a>
      <a href="#why-us" data-en="Why Us" data-hi="हमें क्यों चुनें">Why Us</a>
      <a href="#mirzapur" data-en="Mirzapur" data-hi="मिर्ज़ापुर">Mirzapur</a>
      <a href="#wholesale" data-en="Wholesale" data-hi="थोक">Wholesale</a>
      <a href="#contact" data-en="Contact" data-hi="संपर्क करें">Contact</a>
      <button class="lang-toggle" id="lang-toggle" type="button">हिंदी</button>
    </nav>
    <a href="#wholesale" class="btn btn--primary header-cta" data-en="Get Bulk Pricing" data-hi="थोक मूल्य जानें"></a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu">☰</button>
  </div>
</header>

<main>

  <section class="section hero" id="hero">
    <div class="container grid-12">
      <div class="span-7 hero__content reveal">
        <p class="section__eyebrow" data-en="Mirzapur, Uttar Pradesh — Pre-Launch" data-hi="मिर्ज़ापुर, उत्तर प्रदेश — लॉन्च-पूर्व"></p>
        <h1 class="display hero__headline">
          <span class="hero__line" data-en="Paper Foodware," data-hi="पेपर फूडवेयर,"></span>
          <span class="hero__line" data-en="Made For" data-hi="बना रोज़मर्रा के"></span>
          <span class="hero__line" data-en="Everyday India" data-hi="भारत के लिए"></span>
        </h1>
        <p class="hero__sub" data-en="Bulk-ready paper donas and plates for hotels, restaurants, sweet shops, caterers and banquet halls in Mirzapur." data-hi="मिर्ज़ापुर में होटल, रेस्टोरेंट, मिठाई की दुकानों, कैटरर्स और बैंक्वेट हॉल के लिए थोक में तैयार पेपर दोना और पत्तल।"></p>
        <div class="hero__actions">
          <a class="btn btn--primary whatsapp-link" target="_blank" rel="noopener"
             data-en="Get Bulk Pricing on WhatsApp" data-hi="व्हाट्सएप पर थोक मूल्य जानें"
             data-msg-en="Hi, I'm interested in bulk wholesale pricing for paper dona/pattal. Could you share details?"
             data-msg-hi="नमस्ते, मुझे पेपर दोना/पत्तल के थोक मूल्य में रुचि है। कृपया जानकारी साझा करें।"></a>
        </div>
      </div>
      <div class="span-5 hero__photo-wrap reveal">
        <span class="hero__meta" data-en="MIRZAPUR / U.P." data-hi="मिर्ज़ापुर / उ.प्र."></span>
        <img class="hero__photo" src="../v2/assets/images/hero-food.jpg" alt="Chef preparing Indian street food chaat with fresh toppings and spices" loading="lazy">
      </div>
    </div>
  </section>

  <section class="section product-range" id="product-range">
    <div class="container">
      <div class="reveal">
        <p class="section__eyebrow" data-en="Product Range" data-hi="उत्पाद श्रृंखला"></p>
        <h2 class="heading" data-en="Six Sizes, One Reliable Supply" data-hi="छह आकार, एक भरोसेमंद आपूर्ति"></h2>
      </div>
      <div class="product-grid" id="products-grid"></div>
    </div>
  </section>

  <section class="section who-we-supply" id="who-we-supply">
    <div class="container">
      <div class="reveal">
        <p class="section__eyebrow" data-en="Who We Supply" data-hi="हम किसे आपूर्ति करते हैं"></p>
        <h2 class="heading" data-en="Built For Businesses That Serve Food Every Day" data-hi="रोज़ भोजन परोसने वाले व्यवसायों के लिए बनाया गया"></h2>
        <p data-en="From street carts to banquet halls — reliable bulk supply for every kitchen." data-hi="स्ट्रीट कार्ट से लेकर बैंक्वेट हॉल तक — हर रसोई के लिए भरोसेमंद थोक आपूर्ति।"></p>
      </div>
      <div class="supply-grid" id="supply-grid"></div>
    </div>
  </section>

  <section class="section why-us" id="why-us">
    <div class="container">

      body.appendChild(spec);
      body.appendChild(link);
      card.appendChild(number);
      card.appendChild(photo);
      card.appendChild(body);
      grid.appendChild(card);
    });
  }

  function renderProcessSteps() {
    var grid = document.getElementById('process-grid');
    PROCESS_STEPS.forEach(function (step) {
      var el = document.createElement('article');
      el.className = 'process-step reveal';
      el.innerHTML =
        '<div class="process-step__icon">' + step.svg + '</div>' +
        '<div class="process-step__number">' + step.num + '</div>' +
        '<h3 class="process-step__name" data-en="' + step.nameEn + '" data-hi="' + step.nameHi + '"></h3>' +
        '<p class="process-step__desc" data-en="' + step.descEn + '" data-hi="' + step.descHi + '"></p>';
      grid.appendChild(el);
    });
  }

  function initProcessAnimations() {
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
    gsap.registerPlugin(ScrollTrigger);

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    gsap.utils.toArray('.process-step__icon').forEach(function (icon, i) {
      gsap.from(icon, {
        opacity: 0,
        y: 24,
        duration: reduceMotion ? 0.01 : 0.6,
        ease: 'power2.out',
        scrollTrigger: { trigger: icon, start: 'top 85%', once: true },
        delay: i * 0.12
      });
    });

    gsap.utils.toArray('.process-step__name, .process-step__desc').forEach(function (el, i) {
      gsap.from(el, {
        opacity: 0,
        y: 16,
        duration: reduceMotion ? 0.01 : 0.5,
        ease: 'power2.out',
        scrollTrigger: { trigger: el, start: 'top 85%', once: true },
        delay: (i % 2) * 0.08
      });
    });
  }

  function renderSupplyCards() {
    var grid = document.getElementById('supply-grid');
    SUPPLY_TYPES.forEach(function (s) {
      var card = document.createElement('article');
      card.className = 'supply-card reveal';
      card.innerHTML =
        '<div class="supply-card__icon">' + s.icon + '</div>' +
        '<h3 class="supply-card__name" data-en="' + s.nameEn + '" data-hi="' + s.nameHi + '"></h3>';
      grid.appendChild(card);
    });
  }

  function renderWhyUsCards() {
    var grid = document.getElementById('why-us-grid');
    WHY_US.forEach(function (item) {
      var card = document.createElement('article');
      card.className = 'why-us-card reveal';
      card.innerHTML =
        '<div class="why-us-card__icon">' + item.icon + '</div>' +
        '<h3 class="why-us-card__name" data-en="' + item.nameEn + '" data-hi="' + item.nameHi + '"></h3>' +
        '<p class="why-us-card__desc" data-en="' + item.descEn + '" data-hi="' + item.descHi + '"></p>';
      grid.appendChild(card);
    });
  }

  function renderWholesaleCards() {
    var grid = document.getElementById('wholesale-grid');
    WHOLESALE_TIERS.forEach(function (tier) {
      var card = document.createElement('article');
      card.className = 'wholesale-card reveal' + (tier.badgeEn ? ' wholesale-card--featured' : '');
      var featuresHtml = tier.featuresEn.map(function (f, i) {
        return '<li><span data-en="' + f + '" data-hi="' + tier.featuresHi[i] + '"></span></li>';
      }).join('');
      var badgeHtml = tier.badgeEn ? '<span class="wholesale-card__badge" data-en="' + tier.badgeEn + '" data-hi="' + tier.badgeHi + '"></span>' : '';
      card.innerHTML =
        badgeHtml +
        '<h3 class="wholesale-card__title" data-en="' + tier.nameEn + '" data-hi="' + tier.nameHi + '"></h3>' +
        '<p class="wholesale-card__desc" data-en="' + tier.descEn + '" data-hi="' + tier.descHi + '"></p>' +
        '<div class="wholesale-card__price" data-en="' + tier.price + ' ' + tier.unitEn + '" data-hi="' + tier.price + ' ' + tier.unitHi + '"></div>' +
        '<ul class="wholesale-card__features">' + featuresHtml + '</ul>' +
        '<a class="btn btn--primary whatsapp-link wholesale-card__cta" target="_blank" rel="noopener" data-en="Get This Rate" data-hi="यह दर पाएं" data-msg-en="Hi, I\'m interested in the ' + tier.nameEn + ' wholesale tier. Could you share details?" data-msg-hi="नमस्ते, मुझे ' + tier.nameHi + ' थोक टियर में रुचि है। कृपया जानकारी साझा करें।"></a>';
      grid.appendChild(card);
    });
  }

  function getStoredLang() {
    try { return localStorage.getItem(STORAGE_KEY) || 'en'; } catch (e) { return 'en'; }
  }
  function setStoredLang(lang) {
    try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) { /* private mode etc: ignore */ }
  }
  function buildWhatsAppLink(message) {
    return 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(message);
  }
  function refreshWhatsAppLinks() {
    document.querySelectorAll('.whatsapp-link').forEach(function (el) {
      var msg = window.currentLang === 'hi' ? el.getAttribute('data-msg-hi') : el.getAttribute('data-msg-en');
      if (msg) { el.href = buildWhatsAppLink(msg); }
    });
  }
  function applyLanguage(lang) {
    window.currentLang = lang;
    document.querySelectorAll('[data-en]').forEach(function (el) {
      var text = lang === 'hi' ? el.getAttribute('data-hi') : el.getAttribute('data-en');
      if (text !== null) { el.textContent = text; }
    });
    document.documentElement.setAttribute('lang', lang === 'hi' ? 'hi' : 'en');
    var toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) { toggleBtn.textContent = lang === 'hi' ? 'English' : 'हिंदी'; }
    refreshWhatsAppLinks();
  }
  function toggleLanguage() {
    var next = window.currentLang === 'hi' ? 'en' : 'hi';
    setStoredLang(next);
    applyLanguage(next);
  }

  function initScrollReveal() {
    var items = document.querySelectorAll('.reveal');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
      items.forEach(function (el) { el.style.opacity = 1; });
      return;
    }
    gsap.registerPlugin(ScrollTrigger);
    items.forEach(function (el) {
      gsap.set(el, { opacity: 0, y: reduceMotion ? 0 : 24 });
      gsap.to(el, {
        opacity: 1,
        y: 0,
        duration: reduceMotion ? 0.01 : 0.7,
        ease: 'power2.out',
        scrollTrigger: { trigger: el, start: 'top 85%', once: true }
      });
    });
  }

  function initHeroAnimations() {
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var lines = document.querySelectorAll('.hero__line');
    var photo = document.querySelector('.hero__photo');

    // Safety net: force the hero visible after a delay no matter what, so a
    // stalled or failed animation (slow device, backgrounded tab, a GSAP CDN
    // hiccup) can never leave the headline/photo permanently invisible.
    var revealed = false;
    function forceReveal() {
      if (revealed) { return; }
      revealed = true;
      lines.forEach(function (line) { line.style.clipPath = 'inset(0 0% 0 0)'; });
      if (photo) { photo.style.clipPath = 'inset(0% 0 0 0)'; }
    }
    setTimeout(forceReveal, 2000);

    if (typeof gsap === 'undefined') { forceReveal(); return; }

    // Staggered line-by-line reveal using clip-path
    lines.forEach(function (line) {
      gsap.set(line, { clipPath: 'inset(0 100% 0 0)' });
    });

    var tl = gsap.timeline({ delay: 0.2, onComplete: function () { revealed = true; } });
    tl.to(lines, {
      clipPath: 'inset(0 0% 0 0)',
      duration: reduceMotion ? 0.01 : 0.8,
      ease: 'power3.out',
      stagger: 0.12
    });

    // Clip-path photo reveal (unveils top to bottom)
    if (photo) {
      gsap.set(photo, { clipPath: 'inset(100% 0 0 0)' });
      tl.to(photo, {
        clipPath: 'inset(0% 0 0 0)',
        duration: reduceMotion ? 0.01 : 1.2,
        ease: 'power3.out'
      }, '-=0.4'); // Start 0.4s before line animation ends
    }
  }

  function splitHeroLines() {
    // Split each .hero__line text into character spans for potential char-level animation
    // Currently using line-level clip-path, so this is a no-op but kept for future enhancement
  }

  document.addEventListener('DOMContentLoaded', function () {
    renderProducts();
    renderProcessSteps();
    renderSupplyCards();
    renderWhyUsCards();
    renderWholesaleCards();

    var toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) { toggleBtn.addEventListener('click', toggleLanguage); }

    var navToggle = document.getElementById('nav-toggle');
    var navLinks = document.querySelector('.nav-links');
    if (navToggle && navLinks) {
      navToggle.addEventListener('click', function () {
        navLinks.classList.toggle('is-open');
      });
      navLinks.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () { navLinks.classList.remove('is-open'); });
      });
    }

    applyLanguage(getStoredLang());
    initHeroAnimations();
    initScrollReveal();
    initProcessAnimations();
  });
})();
</script>
</body>
</html>
